<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="shortcut icon"
        href="https://traxion.global/hubfs/traxion-global-sitio-mar24/Nuevos%20Logos%20REDIMENSI%C3%93N/Logos%20TRAXION%20-%20No%20tilde/SVG-500x150_17-TRAXION%20ESP%20GRIS.svg">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
    <title>Traxion - Guardian AI</title>
</head>

<body>
    <nav class="header">
        <div class="header-container">
            <div class="logo-container">
                <img src="https://traxion.global/hubfs/Traxion_LogotipoCT_Gris.png" alt="Traxion Logo" class="logo"
                    loading="lazy">
            </div>
            <h1 class="header-title">Guardian AI - Customer Health Monitor</h1>

            <ul class="nav-links">
                <li><a href="https://traxion.global/es/">Servicios</a></li>
                <li><a href="#monitor">Monitor</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>


    <main id="monitor" class="main-container">

        <aside>
            <h3 class="sidebar-title">Métricas del Cliente</h3>

            <div class="input-group">
                <label>Nivel de Servicio (%)</label>
                <input type="number" id="in-servicio" min="0" max="100" placeholder="85" required onkeydown="return event.keyCode !== 69">
            </div>

            <div class="input-group">
                <label>Puntualidad (%)</label>
                <input type="number" id="in-puntualidad" min="0" max="100" placeholder="90" required onkeydown="return event.keyCode !== 69">
            </div>

            <div class="input-group">
                <label>Satisfacción (0-10)</label>
                <input type="number" id="in-nps" min="0" max="10" placeholder="7" required onkeydown="return event.keyCode !== 69">
            </div>

            <div class="input-group">
                <label>Quejas Abiertas</label>
                <input type="number" id="in-quejas" min="0" max="25" placeholder="1" required onkeydown="return event.keyCode !== 69">
            </div>

            <button class="aside-button" onclick="procesarIA()">Analizar Riesgo</button>
        </aside>

        
    </main>
</body>
</html>
